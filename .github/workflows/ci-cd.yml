name: CI/CD — oficina-auth-function

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, homolog]

env:
  GCP_PROJECT_ID: oficina-501820
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/863475645726/locations/global/workloadIdentityPools/github-actions/providers/github
  GCP_SERVICE_ACCOUNT: github-actions-ci@oficina-501820.iam.gserviceaccount.com
  INSTANCE_CONNECTION_NAME: oficina-501820:southamerica-east1:oficina-postgres

jobs:
  # ─────────────────────────────────────────
  # Build + testes de compilação dos dois módulos (roda sempre)
  # ─────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build auth/
        working-directory: auth
        run: mvn -q -DskipTests package

      - name: Build notification/
        working-directory: notification
        run: mvn -q -DskipTests package

  # ─────────────────────────────────────────
  # Deploy das duas functions — homolog -> ambiente homolog,
  # main -> ambiente produção.
  # ─────────────────────────────────────────
  deploy:
    name: Deploy das Functions
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar no GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Definir sufixo do ambiente
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "suffix=producao" >> "$GITHUB_OUTPUT"
            echo "db_name=oficina_producao" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=homolog" >> "$GITHUB_OUTPUT"
            echo "db_name=oficina_homolog" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy oficina-auth-${{ steps.env.outputs.suffix }}
        run: |
          gcloud functions deploy oficina-auth-${{ steps.env.outputs.suffix }} \
            --gen2 \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --runtime=java21 \
            --source=auth \
            --entry-point=br.com.fiap.challange.oficina.authfunction.AuthFunction \
            --trigger-http \
            --allow-unauthenticated \
            --memory=512Mi \
            --timeout=30s \
            --set-env-vars="INSTANCE_CONNECTION_NAME=${{ env.INSTANCE_CONNECTION_NAME }},DB_NAME=${{ steps.env.outputs.db_name }},DB_USER=oficina,JWT_EXPIRATION=86400000" \
            --set-secrets="DB_PASSWORD=oficina-db-password:latest,JWT_SECRET=oficina-jwt-secret:latest" \
            --service-account=oficina-app-cloudsql@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Deploy oficina-notification-${{ steps.env.outputs.suffix }}
        run: |
          gcloud functions deploy oficina-notification-${{ steps.env.outputs.suffix }} \
            --gen2 \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --runtime=java21 \
            --source=notification \
            --entry-point=br.com.fiap.challange.oficina.notificationfunction.NotificationFunction \
            --trigger-topic=oficina-notificacoes-${{ steps.env.outputs.suffix }} \
            --memory=256Mi \
            --timeout=60s \
            --set-env-vars="MAIL_HOST=smtp.gmail.com,MAIL_PORT=587,MAIL_AUTH=true,MAIL_STARTTLS=true,MAIL_FROM=oficina@localhost" \
            --set-secrets="MAIL_USERNAME=oficina-mail-username:latest,MAIL_PASSWORD=oficina-mail-password:latest" \
            --service-account=oficina-app-cloudsql@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
